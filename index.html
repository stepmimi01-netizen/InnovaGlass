<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو Lightboard الافتراضي</title>
<style>
@property --p{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{--neon:#00e5ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#1a2238 0%,#05070d 70%);color:#e6f7ff;font-family:Tahoma,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;padding:16px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:1.1rem;font-weight:500;opacity:.8;margin:6px 0 14px}

.stage{position:relative;width:min(900px,100%);aspect-ratio:16/9;background:linear-gradient(#0d1424,#060910);border-radius:14px;overflow:hidden;box-shadow:0 0 60px #000a inset,0 10px 40px #000a}
.spot{position:absolute;inset:-30%;background:radial-gradient(circle at 50% 30%,#ffffff14,transparent 50%);pointer-events:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:18%;background:linear-gradient(#0000,#000c);z-index:3;pointer-events:none}
.orb{position:absolute;width:70px;height:70px;border-radius:50%;opacity:.4;animation:float 6s ease-in-out infinite;z-index:0}
.orb.plus{background:radial-gradient(circle at 40% 35%,#ffb3b3,#ff1f3d 45%,#5a0010 80%);box-shadow:0 0 30px #ff1f3d88}
.orb.minus{background:radial-gradient(circle at 40% 35%,#b3ecff,#1f8dff 45%,#00204f 80%);box-shadow:0 0 30px #1f8dff88}
.orb::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:40%;height:12%;background:#fff9}
.orb.plus::before{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:12%;height:40%;background:#fff9}
@keyframes float{50%{transform:translateY(-14px)}}

.board{position:absolute;left:10%;right:10%;top:8%;height:58%;border:2px solid #7fe9ff66;border-radius:10px;background:linear-gradient(135deg,#ffffff12,#ffffff04 60%);box-shadow:0 0 30px #00e5ff26,inset 0 0 40px #00e5ff12;padding:18px 22px;overflow:hidden;z-index:1}
.board::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff12 50%,transparent 60%);pointer-events:none}
.text{position:relative;z-index:1;font-size:clamp(15px,2.8vw,28px);line-height:2;text-align:right;direction:rtl;transition:transform .35s ease}

.ch{display:inline-block;color:var(--neon);text-shadow:0 0 4px var(--neon),0 0 12px var(--neon),0 0 26px var(--neon);transform:translateY(var(--y,0)) rotate(var(--r,0deg));animation:ink var(--dur,.32s) linear forwards,flick 4s ease-in-out .4s infinite;-webkit-mask-image:linear-gradient(to left,#000 calc(var(--p) - 18%),transparent var(--p));mask-image:linear-gradient(to left,#000 calc(var(--p) - 18%),transparent var(--p))}
.ch.done{-webkit-mask-image:none;mask-image:none}
.ch.hot{border-bottom:1px dashed #fff8;color:#fff;text-shadow:0 0 6px #fff,0 0 14px var(--neon),0 0 30px var(--neon)}
@keyframes ink{0%{--p:0%;opacity:0;filter:blur(4px) brightness(2)}35%{opacity:1}100%{--p:115%;opacity:1;filter:blur(0) brightness(1)}}
@keyframes flick{0%,100%{text-shadow:0 0 4px var(--neon),0 0 12px var(--neon),0 0 26px var(--neon)}50%{text-shadow:0 0 3px var(--neon),0 0 10px var(--neon),0 0 30px var(--neon),0 0 44px var(--neon)}}

.pen{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff,0 0 18px var(--neon),0 0 34px var(--neon);z-index:4;pointer-events:none;opacity:0;transition:left .14s linear,top .14s linear,opacity .25s}
.pen.on{opacity:1}
.spark{position:absolute;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);pointer-events:none;z-index:3;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}

/* AR hologram */
.holo{position:absolute;right:3%;top:4%;width:36%;aspect-ratio:3/2;z-index:5;opacity:0;pointer-events:none;transition:opacity .4s}
.holo.show{opacity:1}
.holo .frame{position:absolute;inset:0;border:1px solid var(--neon);border-radius:12px;background:radial-gradient(circle at 50% 40%,#00e5ff22,#00101ccc);box-shadow:0 0 28px var(--neon)66,inset 0 0 22px var(--neon)33;overflow:hidden}
.holo .frame::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000040 3px 4px);pointer-events:none;z-index:2}
.holo .frame::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(#0000,#ffffff18,#0000);animation:scan 3.2s linear infinite;z-index:2;pointer-events:none}
@keyframes scan{to{top:110%}}
.holo.show .frame{animation:holoIn .7s ease-out}
@keyframes holoIn{0%{clip-path:inset(50% 0 50% 0);filter:brightness(2) hue-rotate(60deg)}60%{clip-path:inset(0 0 0 0);filter:brightness(1.4)}100%{clip-path:inset(0 0 0 0);filter:none}}
.holo .in{position:absolute;inset:8%;animation:hfloat 3s ease-in-out infinite}
.holo .in svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 4px var(--neon))}
@keyframes hfloat{50%{transform:translateY(-5px)}}
.holo .label{position:absolute;top:-22px;right:0;font-size:13px;color:var(--neon);text-shadow:0 0 8px var(--neon);white-space:nowrap}

/* teacher */
.teacherWrap{position:absolute;bottom:2%;left:50%;width:min(22%,190px);transform:translateX(-50%);transition:left .6s cubic-bezier(.4,0,.2,1);z-index:2;filter:drop-shadow(0 0 8px #ffffff30)}
.tsvg{display:block;width:100%;height:auto}
.tsvg.bob{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.arm{transform-origin:0 0;transition:transform .22s ease-out}
#body{transform-origin:100px 270px;transition:transform .5s ease}

.controls{width:min(900px,100%);margin-top:16px;display:grid;gap:10px}
textarea{width:100%;min-height:90px;background:#0b1020;color:#e6f7ff;border:1px solid #2a3a5a;border-radius:10px;padding:12px;font:inherit;font-size:16px;resize:vertical;direction:rtl}
textarea:focus{outline:none;border-color:var(--neon)}
.hint{font-size:13px;opacity:.6;line-height:1.7}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label{font-size:14px;opacity:.8}
select,input[type=range]{background:#0b1020;color:#e6f7ff;border:1px solid #2a3a5a;border-radius:8px;padding:6px 8px;font:inherit}
button{background:linear-gradient(#0e7c93,#0a5566);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-size:15px;cursor:pointer;box-shadow:0 0 14px #00e5ff44}
button.secondary{background:#1a2238;box-shadow:none;border:1px solid #2a3a5a}
button.pose{background:#1a2238;box-shadow:none;border:1px solid #2a3a5a;padding:8px 12px;font-size:14px}
button.pose.active{border-color:var(--neon);box-shadow:0 0 12px #00e5ff55}
button:disabled{opacity:.4;cursor:not-allowed}
.top{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:min(900px,100%);min-height:90px}
.logo{position:absolute;left:0;top:0;height:90px;width:auto;border-radius:12px;box-shadow:0 0 24px #00e5ff44}

/* merged Canva deck shown above the board, elements appear one by one */
.deck{position:absolute;left:20%;top:8%;width:60%;aspect-ratio:16/9;z-index:6;pointer-events:none;border:1px solid var(--neon);border-radius:8px;overflow:hidden;background:#00101c;box-shadow:0 0 30px var(--neon)66;opacity:0;transition:opacity .5s}
.deck.show{opacity:1}
.deck::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 3px,#00000030 3px 4px);pointer-events:none;z-index:5}
.deck .sl{position:absolute;inset:0;opacity:0;transition:opacity .5s}
.deck .sl.on{opacity:1}
.deck .sl.off{opacity:0}
.deck .base{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:.12;filter:grayscale(1)}
.deck .lay{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;opacity:0;transform:translateY(12px) scale(.96);filter:blur(8px) brightness(2.2);transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1),filter .6s}
.deck .lay.in{opacity:1;transform:none;filter:drop-shadow(0 0 6px var(--neon))}
.ping{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;z-index:7;pointer-events:none;animation:pingIn .5s cubic-bezier(.2,.8,.2,1) forwards,pingOut .5s ease-in 2s forwards}
.ping svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 6px var(--neon))}
.ping .spin{transform-origin:38px 38px;animation:spin 2.4s linear infinite}
.ping .lbl{position:absolute;top:-34px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:13px;color:#fff;background:#000000aa;border:1px solid var(--neon);border-radius:999px;padding:2px 10px;box-shadow:0 0 10px var(--neon)}
@keyframes pingIn{0%{transform:scale(2.4);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes pingOut{to{opacity:0;transform:scale(1.15)}}
@keyframes spin{to{transform:rotate(360deg)}}
.mark{position:absolute;z-index:7;pointer-events:none;transform:translate(-50%,-50%);white-space:nowrap}
.mark.think{animation:mpop .4s cubic-bezier(.2,.8,.2,1) forwards,mfade .5s ease-in 2.6s forwards}
.mark.think .q{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:#fff;color:#0a5566;font-weight:bold;font-size:24px;box-shadow:0 0 14px var(--neon)}
.mark.think .dots{position:absolute;left:-34px;bottom:-14px;display:flex;gap:4px}
.mark.think .dots i{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 8px var(--neon);animation:mdot 1s ease-in-out infinite}
.mark.think .dots i:nth-child(2){animation-delay:.2s}
.mark.think .dots i:nth-child(3){animation-delay:.4s}
.mark.praise{padding:6px 18px;border-radius:999px;font-size:22px;font-weight:bold;color:#fff;background:linear-gradient(#ff4b4b,#b71c1c);border:2px solid #fff;box-shadow:0 0 18px #ff3b3b;animation:mpop .45s cubic-bezier(.2,.8,.2,1) forwards,mfade .5s ease-in 2.1s forwards}
.burst{position:absolute;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;z-index:7;pointer-events:none;animation:mburst .9s ease-out forwards}
@keyframes mpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes mfade{to{opacity:0}}
@keyframes mdot{50%{transform:translateY(-4px);opacity:.4}}
@keyframes mburst{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.teacherWrap::before{content:"";position:absolute;left:50%;bottom:-2px;width:72%;height:16px;transform:translateX(-50%);background:radial-gradient(closest-side,#000d,transparent);z-index:-1;pointer-events:none}
.draw{position:absolute;inset:0;width:100%;height:100%;z-index:3;touch-action:none;pointer-events:none}
.draw.on{pointer-events:auto;cursor:crosshair}
</style>
</head>
<body>
<header class="top"><img class="logo" id="logo" alt="شعار المتوسط بلس"><h1>استوديو Lightboard الافتراضي</h1></header>

<div class="stage" id="stage">
  <div class="spot"></div>
  <div class="orb plus" style="left:5%;top:10%"></div>
  <div class="orb minus" style="left:84%;top:4%;animation-delay:-2s"></div>
  <div class="orb minus" style="left:3%;top:72%;width:52px;height:52px;animation-delay:-4s"></div>
  <div class="orb plus" style="left:90%;top:70%;width:60px;height:60px;animation-delay:-1s"></div>

  <div class="board" id="board">
    <div class="text" id="text"></div>
    <canvas class="draw" id="draw"></canvas>
    <div class="pen" id="pen"></div>
  </div>

  <div class="holo" id="holo">
    <div class="label" id="holoLabel"></div>
    <div class="frame"><div class="in" id="holoIn"></div></div>
  </div>

  <div class="deck" id="deck"></div>

  <div class="teacherWrap" id="tw">
    <svg class="tsvg" id="tsvg" viewBox="0 0 200 300" aria-hidden="true">
      <defs>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="2.5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <linearGradient id="domeShine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></linearGradient>
      </defs>
      <g id="body">
      <line x1="86" y1="180" x2="78" y2="262" stroke="#f4f7fb" stroke-width="24" stroke-linecap="round"/>
      <line x1="114" y1="180" x2="124" y2="262" stroke="#f4f7fb" stroke-width="24" stroke-linecap="round"/>
      <line x1="90" y1="190" x2="84" y2="256" stroke="#1b1f2a" stroke-width="3"/>
      <line x1="110" y1="190" x2="118" y2="256" stroke="#1b1f2a" stroke-width="3"/>
      <ellipse cx="70" cy="274" rx="19" ry="9" fill="#e53935"/>
      <ellipse cx="70" cy="280" rx="17" ry="4" fill="#fff"/>
      <ellipse cx="130" cy="274" rx="19" ry="9" fill="#e53935"/>
      <ellipse cx="130" cy="280" rx="17" ry="4" fill="#fff"/>
      <path d="M74 110 Q100 100 126 110 L130 182 Q100 190 70 182 Z" fill="#f4f7fb"/>
      <path d="M100 106 L100 186" stroke="#1b1f2a" stroke-width="2"/>
      <path d="M120 112 L127 178" stroke="#e53935" stroke-width="4"/>
      <path d="M80 112 L73 178" stroke="#e53935" stroke-width="4"/>
      <circle cx="100" cy="62" r="38" fill="#f4f7fb"/>
      <path d="M61 58 Q62 22 100 22 Q138 22 139 58 Z" fill="#e53935"/>
      <path d="M58 56 Q36 60 30 68 Q56 70 70 62 Z" fill="#c62828"/>
      <rect x="62" y="52" width="76" height="6" fill="#b71c1c"/>
      <clipPath id="domeClip"><path d="M61 58 Q62 22 100 22 Q138 22 139 58 Z"/></clipPath><g clip-path="url(#domeClip)"><image id="capLogo" x="72" y="10" width="56" height="56" preserveAspectRatio="xMidYMid meet"/><path d="M61 58 Q62 22 100 22 Q138 22 139 58 Z" fill="url(#domeShine)"/></g>
      <ellipse cx="86" cy="68" rx="6" ry="4" fill="#3ab4ff" filter="url(#glow)"/>
      <ellipse cx="114" cy="68" rx="6" ry="4" fill="#3ab4ff" filter="url(#glow)"/>
      <line x1="80" y1="60" x2="92" y2="62" stroke="#1b1f2a" stroke-width="2"/>
      <line x1="120" y1="60" x2="108" y2="62" stroke="#1b1f2a" stroke-width="2"/>
      <g transform="translate(70,112)">
        <g id="armL" class="arm">
          <rect x="0" y="-9" width="58" height="18" rx="9" fill="#f4f7fb"/>
          <rect x="0" y="-11" width="20" height="22" rx="6" fill="#e53935"/>
          <rect x="40" y="-10" width="6" height="20" fill="#e53935"/>
          <circle cx="60" cy="0" r="10" fill="#f4f7fb"/>
        </g>
      </g>
      <g transform="translate(130,112)">
        <g id="armR" class="arm">
          <rect x="0" y="-9" width="58" height="18" rx="9" fill="#f4f7fb"/>
          <rect x="0" y="-11" width="20" height="22" rx="6" fill="#e53935"/>
          <rect x="40" y="-10" width="6" height="20" fill="#e53935"/>
          <circle cx="60" cy="0" r="10" fill="#f4f7fb"/>
        </g>
      </g>
      </g>
    </svg>
  </div>

  <div class="floor"></div>
</div>

<div class="controls">
  <textarea id="input" placeholder="اكتب نص الدرس هنا..."></textarea>
  <div class="hint">ضع {{كلمة}} لمشهد مُولّد بالذكاء الاصطناعي، و&lt;&lt;2&gt;&gt; لعرض الشريحة رقم 2، و&lt;&lt;all&gt;&gt; لعرض كل الشرائح. عند طرح سؤال ضع &lt;&lt;سؤال&gt;&gt; ليفكر المعلم مع الصوت، وعند الإجابة ضع &lt;&lt;إجابة&gt;&gt; ليحتفل. و&lt;&lt;إشارة&gt;&gt; للإشارة إلى مكان على اللوح.</div>
  <div class="row">
    <div class="group">
      <button class="pose" data-pose="idle">وقوف</button>
      <button class="pose" data-pose="point">إشارة</button>
      <button class="pose" data-pose="explain">شرح</button>
      <button class="pose" data-pose="think">تفكير</button>
      <button class="pose" data-pose="celebrate">احتفال</button>
    </div>
    <div class="group">
      <label for="color">النيون</label>
      <select id="color">
        <option value="#00e5ff">أزرق سماوي</option>
        <option value="#7cff6b">أخضر</option>
        <option value="#ff6bd6">وردي</option>
        <option value="#ffd166">ذهبي</option>
      </select>
      <label for="speed">السرعة</label>
      <input type="range" id="speed" min="10" max="150" value="60">
    </div>
  </div>
  <div class="row">
    <button id="writeBtn">ابدأ الشرح</button>
    <button id="deckBtn" class="secondary">عرض الشرائح المتحركة</button>
    <button id="drawBtn" class="secondary">تفعيل الرسم الحر</button>
    <button id="drawClr" class="secondary">مسح الرسم</button>
    <label><input type="checkbox" id="syncVoice" checked> قراءة صوتية متزامنة</label>
    <button id="clearBtn" class="secondary">مسح اللوح</button>
  </div>
</div>

function setPose(name) {
  const p = POSES[name];
  tsvg.classList.toggle('bob', p.bob);
  armR.style.transform = `rotate(${p.R}deg)`;
  aimDeg = p.R;
  armL.style.transform = `rotate(${p.L}deg)`;
  document.getElementById('body').style.transform = `rotate(${p.lean}deg)`;
  setActiveButton(name);
}
function aimAt(sx0, sy0) {
  const s = tsvg.getBoundingClientRect();
  const sx = s.left + s.width * 130 / 200, sy = s.top + s.height * 112 / 300;
  aimDeg = Math.atan2(sy0 - sy, sx0 - sx) * 180 / Math.PI;
  armR.style.transform = `rotate(${aimDeg}deg)`;
}
function movePen(x, y) {
  pen.style.left = x + 'px';
  pen.style.top = y + 'px';
  pen.classList.add('on');
  const br = board.getBoundingClientRect();
  aimAt(br.left + x, br.top + y);
  const frac = Math.min(1, Math.max(0, x / board.clientWidth));
  tw.style.left = (12 + 76 * frac) + '%';
}
function spark(x, y) {
  const s = document.createElement('i');
  s.className = 'spark';
  s.style.left = x + 'px';
  s.style.top = y + 'px';
  s.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px');
  s.style.setProperty('--dy', (-Math.random() * 25 - 4) + 'px');
  board.appendChild(s);
  setTimeout(() => s.remove(), 600);
}
function setBusy(b) {
  busy = b;
  writeBtn.disabled = b;
  poseBtns.forEach(btn => btn.disabled = b);
}

/* ---------- AI scenes ---------- */

// The sample capability is granted by the viewer; null means it is not available here.
async function getSample() {
  try { return (await window.claude?.use?.('sample')) || null; }
  catch (e) { return null; }
}

function sanitizeSvg(raw) {
  if (typeof raw !== 'string') return null;
  const doc = new DOMParser().parseFromString(raw, 'image/svg+xml');
  const svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== 'svg' || doc.querySelector('parsererror')) return null;
  svg.querySelectorAll('script,foreignObject,image,use,a,iframe,object,embed,style').forEach(n => n.remove());
  svg.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(at => {
      if (/^on/i.test(at.name) || /href/i.test(at.name)) el.removeAttribute(at.name);
    });
  });
  if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', '0 0 300 200');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  return new XMLSerializer().serializeToString(svg);
}

function scenePrompt(word) {
  return `Create a simple, clear educational illustration for the concept: "${word}".
Return ONLY a JSON object, with no markdown and no commentary, in this form:
{"svg":"<svg xmlns=\\"http://www.w3.org/2000/svg\\" viewBox=\\"0 0 300 200\\">...</svg>"}
Rules:
- Use only rect, circle, ellipse, line, path, polygon, polyline, g and simple text (at most 3 short words).
- No script, foreignObject, image, use, links, or external resources.
- At most 30 elements. Transparent background.
- Use bright neon colors with glowing strokes (stroke-width 3 to 5, fill="none" where suitable).
- Make the drawing show the concept itself, not a generic decoration.`;
}

async function fetchScene(word, ns) {
  try {
    const out = await ns(scenePrompt(word), { modelTier: 'quick' });
    const t = out?.text || '';
    const i = t.indexOf('{'), j = t.lastIndexOf('}');
    if (i < 0 || j < 0) return null;
    return sanitizeSvg(JSON.parse(t.slice(i, j + 1)).svg);
  } catch (e) {
    return null;
  }
}

function prefetchScenes(words, ns) {
  words.forEach(w => {
    if (!sceneCache.has(w)) sceneCache.set(w, ns ? fetchScene(w, ns) : Promise.resolve(null));
  });
}

async function showScene(word) {
  const svg = await sceneCache.get(word);
  holoLabel.textContent = word;
  if (!svg) {
    holoIn.innerHTML = '';
    holoLabel.textContent = word + ' (تعذر إنشاء المشهد)';
  } else {
    holoIn.innerHTML = svg;
  }
  holo.classList.remove('show');
  void holo.offsetWidth; // restart the hologram animation
  holo.classList.add('show');
  const r = holo.getBoundingClientRect();
  aimAt(r.left + r.width / 2, r.top + r.height / 2);
  const hc = stageCoords(r);
  ping(document.getElementById('stage'), hc.x, hc.y, 'انظر');
  clearTimeout(holoTimer);
  holoTimer = setTimeout(() => holo.classList.remove('show'), 9000);
}

/* ---------- writing ---------- */

function parseLesson(content) {
  const parts = [], re = /\{\{(.+?)\}\}|<<\s*(\d+|all|سؤال|إجابة|تفكير|احتفال|إشارة)\s*>>/g;
  let last = 0, m;
  while ((m = re.exec(content))) {
    if (m.index > last) parts.push({ scene: false, v: content.slice(last, m.index) });
    if (m[1] !== undefined) parts.push({ scene: true, v: m[1].trim() });
    else if (/^(\d+|all)$/.test(m[2])) parts.push({ deck: true, v: m[2] });
    else parts.push({ act: true, v: m[2] });
    last = re.lastIndex;
  }
  if (last < content.length) parts.push({ scene: false, v: content.slice(last) });
  return parts;
}

function clearBoard(reset = true) {
  if (reset) runId++;
  [...textEl.childNodes].forEach(n => n.remove());
  textEl.style.transform = '';
  pen.classList.remove('on');
  document.querySelectorAll('.spark').forEach(s => s.remove());
  holo.classList.remove('show');
}

async function typeWord(word, hot, base) {
  const span = document.createElement('span');
  span.className = 'ch' + (hot ? ' hot' : '');
  span.textContent = word;
  span.style.setProperty('--r', (Math.random() * 2 - 1).toFixed(2) + 'deg');
  span.style.setProperty('--y', (Math.random() - 0.5).toFixed(2) + 'px');
  const dur = Math.max(260, base * word.length * 0.55);
  span.style.setProperty('--dur', dur.toFixed(0) + 'ms');
  span.addEventListener('animationend', e => {
    if (e.animationName === 'ink') span.classList.add('done');
  });
  textEl.appendChild(span);

  const shift = Math.max(0, span.offsetTop - board.clientHeight * 0.55);
  textEl.style.transform = `translateY(${-shift}px)`;

  // the pen travels from the start of the word to its end while the word is revealed
  const r = span.getBoundingClientRect(), b = board.getBoundingClientRect();
  const y = r.top - b.top + r.height * 0.55;
  const steps = Math.max(2, Math.min(8, word.length));
  for (let i = 0; i <= steps; i++) {
    if (i === 0 || i === steps || i % 2 === 0) {
      const x = r.right - b.left - r.width * (i / steps);
      movePen(x, y);
      spark(x, y);
    }
    await sleep(dur / steps);
  }
}

async function write() {
  const content = input.value;
  if (!content.trim()) { input.focus(); return; }

  const id = ++runId;
  clearBoard(false);
  setBusy(true);
  setActiveButton('');
  armL.style.transform = 'rotate(120deg)';
  document.getElementById('body').style.transform = 'rotate(-7deg)';
  tsvg.classList.remove('bob');

  const parts = parseLesson(content);
  const scenes = [...new Set(parts.filter(p => p.scene).map(p => p.v))];
  if (scenes.length) {
    const ns = await getSample();
    prefetchScenes(scenes, ns);
    if (!ns) holoLabel.textContent = 'المشاهد تحتاج تفعيل الذكاء الاصطناعي في هذا العرض';
  }

  const base = 230 - Number(speedR.value);
  const syncOn = voiceChk.checked && 'speechSynthesis' in window;
  if (syncOn) speechSynthesis.cancel();

  for (const part of parts) {
    if (id !== runId) break;

    if (part.act) {
      if (part.v === 'تفكير' || part.v === 'سؤال') { setPose('think'); showThink(); await sleep(1400); }
      else if (part.v === 'احتفال' || part.v === 'إجابة') { setPose('celebrate'); celebrate(); await sleep(2400); }
      else if (part.v === 'إشارة') {
        setPose('point');
        const p = pointTarget(board);
        ping(board, p.x, p.y, 'هنا');
        await sleep(1200);
      }
      setPose('idle');
      continue;
    }

    if (part.deck) {
      if (part.v === 'all') await playDeck(null);
      else {
        const n = Number(part.v) - 1;
        if (n >= 0 && n < SLIDES.length) await playDeck([n]);
      }
      continue;
    }

    if (part.scene) showScene(part.v);

    // split into words, spaces and line breaks so Arabic words stay joined
    for (const tok of part.v.split(/(\s+)/)) {
      if (id !== runId) break;
      if (!tok) continue;
      if (/^\s+$/.test(tok)) {
        if (tok.includes('\n')) {
          textEl.appendChild(document.createElement('br'));
          await sleep(base * 2);
        } else {
          textEl.appendChild(document.createTextNode(' '));
          await sleep(base * 1.2);
        }
        continue;
      }
      if (syncOn) {
        await speakWord(tok, !!part.scene, id, base);
      } else {
        await typeWord(tok, !!part.scene, base);
        const pause = /[.,!?؟،:;]$/.test(tok) ? 3.5 : 1;
        await sleep(base * 0.5 * pause * (0.8 + Math.random() * 0.4));
      }
    }
  }

  if (id === runId) {
    pen.classList.remove('on');
    setBusy(false);
    setPose('idle');
  }
}

poseBtns.forEach(btn => btn.addEventListener('click', () => {
  if (busy) return;
  setPose(btn.dataset.pose);
  if (btn.dataset.pose === 'point') {
    const p = pointTarget(board);
    ping(board, p.x, p.y, 'هنا');
  }
  if (btn.dataset.pose === 'think') showThink();
  if (btn.dataset.pose === 'celebrate') celebrate();
}));
writeBtn.addEventListener('click', write);
clearBtn.addEventListener('click', () => {
  clearBoard(true);
  clearDrawing();
  if (window.speechSynthesis) speechSynthesis.cancel();
  setBusy(false);
  setPose('idle');
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) write();
});

const deckEl = $('deck'), deckBtn = $('deckBtn');
let deckRun = 0;
function regionClip(r) {
  const [x, y, w, h] = r;
  return `inset(${y}% ${(100 - x - w).toFixed(2)}% ${(100 - y - h).toFixed(2)}% ${x}%)`;
}
async function playDeck(only = null) {
  const id = ++deckRun;
  deckEl.innerHTML = '';
  deckEl.classList.add('show');
  deckBtn.disabled = true;
  setPose('point');
  const dr = deckEl.getBoundingClientRect();
  aimAt(dr.left + dr.width / 2, dr.top + dr.height / 2);
  const dc = stageCoords(dr);
  ping(document.getElementById('stage'), dc.x, dc.y, 'الشريحة');

  for (const s of (only ? only.map(i => SLIDES[i]) : SLIDES)) {
    if (id !== deckRun) break;
    const sl = document.createElement('div');
    sl.className = 'sl';
    const base = document.createElement('img');
    base.className = 'base'; base.src = s.src; base.alt = '';
    sl.appendChild(base);
    deckEl.appendChild(sl);
    requestAnimationFrame(() => sl.classList.add('on'));

    for (const r of s.regions) {
      if (id !== deckRun) break;
      const img = document.createElement('img');
      img.className = 'lay'; img.src = s.src; img.alt = '';
      img.style.clipPath = regionClip(r);
      sl.appendChild(img);
      await sleep(60);
      img.classList.add('in');   // this element lights up
      await sleep(420);          // then the next one
    }
    await sleep(1800);
    sl.classList.remove('on');
    sl.classList.add('off');
    await sleep(500);
    sl.remove();
  }
  if (id === deckRun) {
    deckEl.classList.remove('show');
    deckEl.innerHTML = '';
    setPose('idle');
    deckBtn.disabled = false;
  }
}
deckBtn.addEventListener('click', () => { if (!busy) playDeck(); });

/* ---------- pointing marker and sound ---------- */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
  return actx;
}
document.addEventListener('pointerdown', ensureAudio, { once: true });

function tone(freq, t0, dur, vol) {
  const c = ensureAudio();
  if (!c) return;
  const t = c.currentTime + t0;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  o.frequency.exponentialRampToValueAtTime(freq * 0.6, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function chime() {
  tone(1480, 0, 0.5, 0.22);
  tone(1976, 0.09, 0.6, 0.14);
}

// where the arm is pointing, as coordinates inside the given container
function pointTarget(container) {
  const s = tsvg.getBoundingClientRect();
  const sx = s.left + s.width * 130 / 200, sy = s.top + s.height * 112 / 300;
  const rad = aimDeg * Math.PI / 180, L = Math.max(board.clientWidth * 0.45, 120);
  const tx = sx + Math.cos(rad) * L, ty = sy + Math.sin(rad) * L;
  const c = container.getBoundingClientRect();
  return {
    x: Math.min(c.width - 30, Math.max(30, tx - c.left)),
    y: Math.min(c.height - 30, Math.max(30, ty - c.top))
  };
}
function stageCoords(r) {
  const st = document.getElementById('stage').getBoundingClientRect();
  return { x: r.left + r.width / 2 - st.left, y: r.top + r.height / 2 - st.top };
}

// a target marker that snaps in with a chime, then fades out
function ping(container, x, y, label = 'هنا') {
  const el = document.createElement('div');
  el.className = 'ping';
  el.style.left = x + 'px';
  el.style.top = y + 'px';
  el.innerHTML =
    `<div class="lbl">${label}</div>` +
    `<svg viewBox="0 0 76 76" aria-hidden="true">` +
    `<circle cx="38" cy="38" r="30" fill="none" stroke="var(--neon)" stroke-width="2" opacity=".9"/>` +
    `<circle class="spin" cx="38" cy="38" r="20" fill="none" stroke="var(--neon)" stroke-width="1.4" stroke-dasharray="4 5"/>` +
    `<path d="M38 2v12M38 62v12M2 38h12M62 38h12" stroke="var(--neon)" stroke-width="2"/>` +
    `<circle cx="38" cy="38" r="3.5" fill="#fff"/></svg>`;
  container.appendChild(el);
  chime();
  setTimeout(() => el.remove(), 2600);
}

/* ---------- thinking and celebration markers with sound ---------- */
function headPoint() {
  const h = tsvg.getBoundingClientRect();
  const st = document.getElementById('stage').getBoundingClientRect();
  return { x: h.left + h.width * 0.5 - st.left, y: h.top + h.height * 0.21 - st.top, w: h.width, h: h.height };
}
function clearMarks() {
  document.querySelectorAll('.mark, .burst').forEach(e => e.remove());
}

// thinking: a thought bubble with a question mark, and a soft two-note "hmm"
function showThink() {
  clearMarks();
  const stage = document.getElementById('stage');
  const hp = headPoint();
  const el = document.createElement('div');
  el.className = 'mark think';
  el.style.left = (hp.x + hp.w * 0.34) + 'px';
  el.style.top = (hp.y - hp.h * 0.16) + 'px';
  el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="q">?</span>';
  stage.appendChild(el);
  tone(660, 0, 0.35, 0.12);
  tone(523, 0.28, 0.55, 0.1);
  setTimeout(() => el.remove(), 3200);
}

// celebration: a burst of light particles, a "ممتاز!" badge, and a rising arpeggio
function celebrate() {
  clearMarks();
  const stage = document.getElementById('stage');
  const hp = headPoint();
  const cx = hp.x, cy = hp.y + hp.h * 0.25;
  for (let i = 0; i < 16; i++) {
    const p = document.createElement('i');
    p.className = 'burst';
    const a = (i / 16) * Math.PI * 2, d = 70 + Math.random() * 60;
    p.style.left = cx + 'px';
    p.style.top = cy + 'px';
    p.style.setProperty('--dx', (Math.cos(a) * d).toFixed(1) + 'px');
    p.style.setProperty('--dy', (Math.sin(a) * d).toFixed(1) + 'px');
    p.style.background = i % 2 ? 'var(--neon)' : '#ff3b3b';
    p.style.boxShadow = '0 0 10px ' + (i % 2 ? 'var(--neon)' : '#ff3b3b');
    stage.appendChild(p);
    setTimeout(() => p.remove(), 1000);
  }
  const badge = document.createElement('div');
  badge.className = 'mark praise';
  badge.textContent = 'ممتاز!';
  badge.style.left = cx + 'px';
  badge.style.top = (hp.y - hp.h * 0.42) + 'px';
  stage.appendChild(badge);
  setTimeout(() => badge.remove(), 2600);
  [[523, 0, 0.22], [659, 0.12, 0.22], [784, 0.24, 0.22], [1047, 0.36, 0.6]]
    .forEach(([f, t, d]) => tone(f, t, d, 0.2));
}

/* ---------- free drawing on the board ---------- */
const cv = $('draw'), cvx = cv.getContext('2d');
const drawBtn = $('drawBtn'), drawClr = $('drawClr'), voiceChk = $('syncVoice');
let drawOn = false, drawing = false, lastPt = null;

function fitCanvas() {
  const r = board.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  const old = document.createElement('canvas');
  old.width = cv.width; old.height = cv.height;
  if (cv.width) old.getContext('2d').drawImage(cv, 0, 0);
  cv.width = Math.round(r.width * dpr);
  cv.height = Math.round(r.height * dpr);
  cvx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cvx.lineCap = 'round';
  cvx.lineJoin = 'round';
  if (old.width) cvx.drawImage(old, 0, 0, r.width, r.height);
}
function clearDrawing() {
  cvx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
}
function canvasPoint(e) {
  const r = cv.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
cv.addEventListener('pointerdown', e => {
  if (!drawOn) return;
  drawing = true;
  cv.setPointerCapture(e.pointerId);
  lastPt = canvasPoint(e);
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = canvasPoint(e);
  const col = getComputedStyle(document.documentElement).getPropertyValue('--neon').trim() || '#00e5ff';
  cvx.strokeStyle = col;
  cvx.shadowColor = col;
  cvx.shadowBlur = 12;
  cvx.lineWidth = 4;
  cvx.beginPath();
  cvx.moveTo(lastPt.x, lastPt.y);
  cvx.lineTo(p.x, p.y);
  cvx.stroke();
  lastPt = p;
});
const stopDraw = () => { drawing = false; lastPt = null; };
cv.addEventListener('pointerup', stopDraw);
cv.addEventListener('pointercancel', stopDraw);

drawBtn.addEventListener('click', () => {
  drawOn = !drawOn;
  cv.classList.toggle('on', drawOn);
  drawBtn.textContent = drawOn ? 'إيقاف الرسم' : 'تفعيل الرسم الحر';
  drawBtn.classList.toggle('active', drawOn);
});
drawClr.addEventListener('click', clearDrawing);
window.addEventListener('resize', fitCanvas);
fitCanvas();

/* ---------- writing synced with the voice ---------- */
// each word is spoken, and written at the moment the voice starts it
function speakWord(tok, hot, id, base) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    const u = new SpeechSynthesisUtterance(tok);
    u.lang = 'ar';
    u.rate = 1;
    u.onstart = () => { if (id === runId) typeWord(tok, hot, base); };
    u.onend = finish;
    u.onerror = finish;
    speechSynthesis.speak(u);
    setTimeout(finish, 3500 + tok.length * 150); // safety net if the browser never ends the word
  });
}

tw.style.left = '50%';
setPose('idle');
</script>
